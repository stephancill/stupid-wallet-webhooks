name = "address-notifications"
main = "src/index.ts"
compatibility_date = "2026-04-21"
workers_dev = false

# Static assets (favicon etc.) served from the local public/ directory.
[assets]
directory = "public"
binding = "ASSETS"

# Custom domain (wt: hosted on the same Cloudflare account).
[[routes]]
pattern = "wallet-webhooks.stupidtech.net"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "address-notifications-db"
database_id = "abb46259-a808-4350-bc3c-cbd8201f85ef"

# rpc-racer worker reachable by service binding (no additional request fees) for
# the scanner's JSON-RPC and chain-metadata traffic.
[[services]]
binding = "RPC_RACER"
service = "rpc-racer"

[[durable_objects.bindings]]
name = "SCANNER_SHARD_1"
class_name = "ScannerShard"

[[durable_objects.bindings]]
name = "SCANNER_SHARD_2"
class_name = "ScannerShard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScannerShard"]

[[queues.producers]]
binding = "MATCHED_ACTIVITY_QUEUE"
queue = "matched-activity"

[[queues.producers]]
binding = "WEBHOOK_DELIVERY_QUEUE"
queue = "webhook-delivery"

[[queues.consumers]]
queue = "matched-activity"
max_batch_size = 5
max_batch_timeout = 2
max_concurrency = 5

[[queues.consumers]]
queue = "webhook-delivery"
max_batch_size = 5
max_batch_timeout = 3
max_concurrency = 8
max_retries = 8
# Exhausted deliveries move here; their state is also in webhook_deliveries.
dead_letter_queue = "webhook-delivery-dlq"

[vars]
RPC_RACER_BASE_URL = "https://evm.stupidtech.net"
RPC_SCANNER_FANOUT = "5"
SCANNER_SHARD_COUNT = "2"
# Blocks scanned per alarm pass before the shard yields (raise to help fast,
# high-throughput chains like Arbitrum catch up after activation).
SCANNER_MAX_BLOCKS_PER_PASS = "100"
# Fastest catch-up poll cadence in ms while a backlog remains.
SCANNER_MIN_POLL_INTERVAL_MS = "1000"
# Minimum cadence between alarms while a chain is caught up (no backlog).
SCANNER_SETTLED_POLL_INTERVAL_MS = "2000"
# Max consecutive blocks fetched per rpc-racer range batch.
SCANNER_MAX_BLOCKS_PER_RANGE = "10"
# Max cadence for persisting the scanner D1 cursor (ms); keeps D1 writes low on
# fast-cadence chains. Default 8000.
SCANNER_CURSOR_D1_MS = "8000"
# Consecutive unresolvable scans before the scanner auto-resyncs a chain.
# Default 3. 0 = disable auto-resync.
SCANNER_UNRESOLVABLE_LIMIT = "3"
# Blocks behind the head to re-anchor at when a cursor is unrecoverable. Default 64.
SCANNER_REANCHOR_DEPTH_BLOCKS = "64"
# Skip a block after N consecutive failures (0 disables). Default 5.
SCANNER_SKIP_BLOCK_FAILURES = "5"
SUBSCRIPTION_DEFAULT_QUOTA = "1000"
CHAIN_DEFAULT_QUOTA = "20"
# Delivery-latency alert threshold in ms (observed→delivered p95). Default 10000.
DELIVERY_LATENCY_ALERT_MS = "10000"
# RPC_INTERNAL_SECRET must be set as a secret (not here) for the scanner to use
# rpc-racer's private /internal route with low fan-out.


[triggers]
crons = ["*/5 * * * *"]
