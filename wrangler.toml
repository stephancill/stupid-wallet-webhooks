name = "address-notifications"
main = "src/index.ts"
compatibility_date = "2026-04-21"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "address-notifications-db"
database_id = "abb46259-a808-4350-bc3c-cbd8201f85ef"

[[durable_objects.bindings]]
name = "SCANNER_SHARD_1"
class_name = "ScannerShard"

[[durable_objects.bindings]]
name = "SCANNER_SHARD_2"
class_name = "ScannerShard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScannerShard"]

[[queues.producers]]
binding = "MATCHED_ACTIVITY_QUEUE"
queue = "matched-activity"

[[queues.producers]]
binding = "WEBHOOK_DELIVERY_QUEUE"
queue = "webhook-delivery"

[[queues.consumers]]
queue = "matched-activity"
max_batch_size = 5
max_batch_timeout = 5

[[queues.consumers]]
queue = "webhook-delivery"
max_batch_size = 5
max_batch_timeout = 10
max_retries = 8
# Exhausted deliveries move here; their state is also in webhook_deliveries.
dead_letter_queue = "webhook-delivery-dlq"

[vars]
RPC_RACER_BASE_URL = "https://evm.stupidtech.net"
RPC_SCANNER_FANOUT = "2"
SCANNER_SHARD_COUNT = "2"
SUBSCRIPTION_DEFAULT_QUOTA = "1000"
CHAIN_DEFAULT_QUOTA = "20"
# RPC_INTERNAL_SECRET must be set as a secret (not here) for the scanner to use
# rpc-racer's private /internal route with low fan-out.


[triggers]
crons = ["*/5 * * * *"]
